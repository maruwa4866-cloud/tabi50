<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>旅の50文</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
  :root{
    --paper:#F3F6F8;
    --surface:#FFFFFF;
    --ink:#16324F;
    --ink-soft:#5F7894;
    --line:#DAE3EC;
    --seal:#C0392B;
    --seal-ink:#FFFFFF;
    --shadow:0 1px 2px rgba(22,50,79,.06), 0 8px 24px rgba(22,50,79,.07);
    --jp:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
    --en:"Literata",Georgia,"Times New Roman",serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#0D1926; --surface:#16283B; --ink:#E6EDF5; --ink-soft:#8CA6C0;
      --line:#26405A; --seal:#E4644D; --seal-ink:#0D1926;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --paper:#0D1926; --surface:#16283B; --ink:#E6EDF5; --ink-soft:#8CA6C0;
    --line:#26405A; --seal:#E4644D; --seal-ink:#0D1926;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  }

  *{box-sizing:border-box}
  [hidden]{display:none !important}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--jp);line-height:1.7;
       -webkit-font-smoothing:antialiased;padding:0 16px 40px}
  .wrap{max-width:430px;margin:0 auto;display:flex;flex-direction:column;gap:22px;padding-top:18px}

  header{display:flex;flex-direction:column;gap:9px}
  .brandrow{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
  .brand{font-size:17px;font-weight:700;letter-spacing:.06em;margin:0}
  .stock{font-family:var(--en);font-variant-numeric:tabular-nums;font-size:15px;color:var(--ink-soft)}
  .stock b{color:var(--seal);font-weight:600;font-size:19px}
  .meter{height:3px;background:var(--line);border-radius:2px;overflow:hidden}
  .meter i{display:block;height:100%;background:var(--seal);width:0;transition:width .5s cubic-bezier(.2,.7,.3,1)}
  .tagline{font-size:12px;color:var(--ink-soft);letter-spacing:.04em;margin:0}

  .screen{display:flex;flex-direction:column;gap:22px}
  .screen[hidden]{display:none}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow)}
  .label{font-size:11px;letter-spacing:.16em;color:var(--ink-soft);text-transform:uppercase;font-weight:500;margin:0}

  button{font-family:var(--jp);font-size:15px;cursor:pointer;border-radius:11px;
         transition:transform .12s ease,background .15s ease,border-color .15s ease}
  button:focus-visible{outline:2px solid var(--seal);outline-offset:2px}
  button:active{transform:translateY(1px)}
  button[disabled]{opacity:.38;cursor:default;transform:none}
  .btn-main{background:var(--ink);color:var(--paper);border:1px solid var(--ink);padding:15px 18px;font-weight:700;letter-spacing:.05em;width:100%}
  .btn-seal{background:var(--seal);color:var(--seal-ink);border:1px solid var(--seal);padding:15px 18px;font-weight:700;letter-spacing:.05em;width:100%}
  .btn-quiet{background:transparent;color:var(--ink);border:1px solid var(--line);padding:12px 16px;font-weight:500;width:100%}
  .btn-text{background:none;border:none;color:var(--ink-soft);font-size:13px;padding:8px;text-decoration:underline;text-underline-offset:3px}
  .row{display:flex;gap:9px}
  .row>*{flex:1}

  .visa{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
  .slot{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-family:var(--en);font-size:9px;font-variant-numeric:tabular-nums}
  .slot.empty{border:1px dashed var(--line);color:transparent}
  .slot.done{background:var(--seal);color:var(--seal-ink);border:1px solid var(--seal);font-weight:600}
  .visa-cap{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:13px}

  .progress-dots{display:flex;gap:5px}
  .progress-dots span{height:3px;flex:1;background:var(--line);border-radius:2px}
  .progress-dots span.on{background:var(--ink-soft)}
  .scene{font-size:11px;letter-spacing:.16em;color:var(--seal);font-weight:700;margin:0 0 10px}
  .situation{font-size:19px;font-weight:500;line-height:1.65;margin:0;text-wrap:balance}
  .hidden-note{font-size:12.5px;color:var(--ink-soft);margin:14px 0 0}

  /* ---- マイク判定 ---- */
  .listening{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--seal);margin-right:8px;animation:pulse 1s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  .heard{font-family:var(--en);color:var(--ink-soft)}
  #sayBtn{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  #sayBtn.hold{animation:holdpulse 1s ease-in-out infinite;transform:scale(.98)}
  @keyframes holdpulse{0%,100%{box-shadow:0 0 0 0 rgba(192,57,43,.45)}50%{box-shadow:0 0 0 12px rgba(192,57,43,0)}}
  .tries{display:flex;gap:7px;justify-content:center;margin-top:6px}
  .tries i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--line);display:block}
  .tries i.miss{background:var(--line)}
  .tries i.hit{background:var(--seal);border-color:var(--seal)}
  .stat{font-family:var(--en);font-size:13px;color:var(--ink-soft);margin:0;font-variant-numeric:tabular-nums}
  .blocker{margin-top:16px;padding:13px 15px;border:1.5px solid var(--seal);border-radius:12px;font-size:13.5px;line-height:1.7}
  .blocker b{color:var(--seal)}

  .answer{border-top:1px solid var(--line);margin-top:18px;padding-top:18px;display:flex;flex-direction:column;gap:10px}
  .en{font-family:var(--en);font-size:27px;line-height:1.35;margin:0;text-wrap:balance}
  .mean{font-size:14px;color:var(--ink-soft);margin:0}
  .tip{font-size:13.5px;margin:4px 0 0;padding:11px 13px;background:var(--paper);border-left:2px solid var(--seal);border-radius:0 7px 7px 0}
  .tip b{font-weight:700}
  .peek{font-family:var(--en);font-size:21px;margin:14px 0 0;color:var(--ink-soft)}

  .verdict{display:flex;align-items:center;gap:13px;min-height:26px;margin-top:12px}
  .verdict p{margin:0;font-size:14px}

  .seal-mark{width:58px;height:58px;flex:0 0 58px;border-radius:50%;
    border:2.5px solid var(--seal);color:var(--seal);display:grid;place-items:center;
    font-family:var(--en);font-weight:600;font-size:11px;line-height:1.1;text-align:center;transform:rotate(-9deg)}
  .seal-mark.land{animation:land .45s cubic-bezier(.2,1.5,.4,1) both}
  @keyframes land{
    0%{transform:rotate(-26deg) scale(2.1);opacity:0}
    60%{opacity:1}
    100%{transform:rotate(-9deg) scale(1);opacity:1}
  }
  @media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}

  .big{font-family:var(--en);font-size:52px;font-weight:600;color:var(--seal);line-height:1;margin:0;font-variant-numeric:tabular-nums}
  .done-body{display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center;padding:8px 0}
  .xfer{display:flex;flex-direction:column;gap:10px}
  .xfer textarea{width:100%;font-family:var(--en);font-size:12px;line-height:1.4;padding:10px;border:1px solid var(--line);border-radius:9px;background:var(--paper);color:var(--ink);resize:none;height:84px}
  .xfer p{margin:0;font-size:13px;color:var(--ink-soft)}
  footer{font-size:11.5px;color:var(--ink-soft);text-align:center;line-height:1.8}

  /* ---- 画像（無ければ自動で非表示） ---- */
  .hero{width:100%;aspect-ratio:12/5;object-fit:cover;display:block;border-radius:14px;box-shadow:var(--shadow)}
  .hero[hidden]{display:none}
  .panel.card{padding:0;overflow:hidden}
  .panel.card .inner{padding:20px}
  .scene-img{width:100%;aspect-ratio:3/2;object-fit:cover;display:block;background:var(--line)}
  .scene-img[hidden]{display:none}
  .stage .icon{width:44px;height:44px;flex:0 0 44px;border-radius:12px;object-fit:cover;background:var(--paper);display:block;position:relative}
  .stage .iconwrap{position:relative;flex:0 0 44px;width:44px;height:44px}
  .stage .iconwrap .num{position:absolute;right:-6px;bottom:-6px;width:20px;height:20px;border-radius:50%;background:var(--surface);border:1.5px solid var(--seal);font-size:11px;line-height:17px;display:block}
  .stage .iconwrap.noimg{display:grid;place-items:center;background:var(--paper);border-radius:12px}
  .stage .iconwrap.noimg .num{position:static;border:none;background:none;font-size:15px;line-height:1;width:auto;height:auto}
  .pick-img{width:44px;height:44px;border-radius:8px;object-fit:cover;background:var(--paper);flex:0 0 44px}

  /* ---- 学びの地図（ホーム） ---- */
  .map{display:flex;flex-direction:column;gap:0}
  .stage{display:flex;align-items:center;gap:13px;padding:13px 4px;border-top:1px solid var(--line);background:none;border-left:none;border-right:none;border-bottom:none;border-radius:0;width:100%;text-align:left;color:var(--ink);font-family:var(--jp)}
  .stage:first-child{border-top:none}
  .stage:active{transform:none;background:var(--paper)}
  .stage .num{font-family:var(--en);font-size:15px;font-weight:600;color:var(--seal);width:20px;text-align:center;flex:0 0 20px}
  .stage .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
  .stage .ttl{font-size:15px;font-weight:700;line-height:1.3;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .stage .sub{font-size:12px;color:var(--ink-soft);line-height:1.5}
  .stage .bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden}
  .stage .bar i{display:block;height:100%;background:var(--seal)}
  .stage .cnt{font-family:var(--en);font-variant-numeric:tabular-nums;font-size:12px;color:var(--ink-soft);flex:0 0 auto}
  .stage[disabled]{opacity:.5}
  .badge{font-size:10px;letter-spacing:.08em;font-weight:700;color:var(--seal-ink);background:var(--seal);padding:2px 7px;border-radius:999px}
  .badge.soft{background:transparent;color:var(--seal);border:1px solid var(--seal)}
  .hear{font-family:var(--en);font-size:19px;line-height:1.4;margin:0}
  .hear-ja{font-size:13px;color:var(--ink-soft);margin:0}
  .picker{display:flex;flex-direction:column;gap:10px}
  .picker label{display:flex;align-items:center;gap:11px;padding:11px 13px;border:1px solid var(--line);border-radius:10px;font-size:15px;cursor:pointer}
  .picker input{width:18px;height:18px;accent-color:var(--seal)}
  .picker small{margin-left:auto;font-family:var(--en);color:var(--ink-soft);font-variant-numeric:tabular-nums}
</style>

<div class="wrap">
  <header>
    <div class="brandrow">
      <h1 class="brand">旅の50文</h1>
      <span class="stock"><b id="stockN">0</b> / <span id="stockT">50</span> 判子</span>
    </div>
    <div class="meter"><i id="meterFill"></i></div>
    <p class="tagline">聞く → 言う → 通じて、迷わなければ判子。</p>
  </header>

  <!-- ホーム：学びの地図 -->
  <section class="screen" id="scHome">
    <img class="hero" id="hero" alt="" hidden>
    <div class="panel">
      <div class="visa-cap">
        <p class="label">学びの地図</p>
        <p class="label">番号はおすすめの順</p>
      </div>
      <div class="map" id="map"></div>
    </div>
    <div class="panel">
      <div class="visa-cap">
        <p class="label">査証欄 · 1. 言える</p>
        <p class="label" id="visaHint">まだ空です</p>
      </div>
      <div class="visa" id="visa"></div>
    </div>
    <div style="display:flex;justify-content:center"><button class="btn-text" id="xferBtn">別の端末・別の開き方に引き継ぐ</button></div>
    <div class="panel xfer" id="xfer" hidden>
      <p class="label">引き継ぎコード</p>
      <p>進み具合は「開き方」ごとに別々に保存されます（ブラウザで開いた分と、ホーム画面のアイコンから開いた分は別）。このコードを貼れば移せます。</p>
      <textarea id="xferOut" readonly></textarea>
      <button class="btn-quiet" id="xferCopy">コードをコピー</button>
      <p class="label" style="margin-top:6px">コードを貼って復元</p>
      <textarea id="xferIn" placeholder="ここに貼る"></textarea>
      <button class="btn-main" id="xferIn_btn">この端末に復元する</button>
      <p id="xferMsg"></p>
    </div>
  </section>

  <!-- 前日リハーサル：場面を選ぶ -->
  <section class="screen" id="scPick" hidden>
    <div class="panel">
      <p class="scene">5. 前日リハーサル</p>
      <p class="situation">明日、行く場面を選ぶ</p>
      <p class="hidden-note" style="margin-bottom:14px">選んだ場面の文を全部、通しで言います。判子の条件はいつもと同じ。</p>
      <div class="picker" id="picker"></div>
    </div>
    <button class="btn-seal" id="pickStart" disabled>この場面で通す</button>
    <button class="btn-text" id="pickBack">地図に戻る</button>
  </section>

  <!-- カード -->
  <section class="screen" id="scCard" hidden>
    <div class="progress-dots" id="dots"></div>

    <div class="panel card">
      <img class="scene-img" id="sceneImg" alt="" hidden>
      <div class="inner">
      <p class="scene" id="scene"></p>
      <p class="situation" id="situation"></p>

      <div id="stageListen">
        <p class="hidden-note" id="stageNote"></p>
        <div class="row" style="margin-top:16px">
          <button class="btn-main" id="playBtn">聞く</button>
          <button class="btn-quiet" id="slowBtn" disabled>ゆっくり</button>
        </div>
        <p class="peek" id="peek" hidden></p>
        <div style="margin-top:9px">
          <button class="btn-seal" id="sayBtn" disabled>押しながら 話す</button>
        </div>
        <div class="verdict" id="verdict"></div>
        <div class="tries" id="tries"></div>
        <div class="blocker" id="blocker" hidden></div>
        <div style="display:flex;justify-content:center;margin-top:4px">
          <button class="btn-text" id="revealBtn">英文を見る</button>
        </div>
      </div>

      <div class="answer" id="answer" hidden>
        <div class="verdict" id="answerVerdict" style="margin-top:0"></div>
        <div id="hearBox" hidden>
          <p class="label">相手</p>
          <p class="hear" id="hearText"></p>
          <p class="hear-ja" id="hearJa"></p>
          <p class="label" style="margin-top:10px">自分</p>
        </div>
        <p class="en" id="enText"></p>
        <p class="mean" id="meanText"></p>
        <p class="stat" id="stat"></p>
        <p class="tip" id="tipText"></p>
        <div class="row" style="margin-top:8px">
          <button class="btn-quiet" id="replayBtn">もう一度聞く</button>
          <button class="btn-main" id="nextBtn">次へ</button>
        </div>
      </div>
      </div>
    </div>
    <button class="btn-text" id="quitBtn">今日はここまでにする</button>
  </section>

  <!-- 終了 -->
  <section class="screen" id="scDone" hidden>
    <div class="panel done-body">
      <p class="label" id="doneLabel">今日ふえた判子</p>
      <p class="big" id="gained">0</p>
      <p class="stat" id="doneStat"></p>
      <p class="mean" id="doneMsg" style="margin-top:6px"></p>
    </div>
    <button class="btn-main" id="backBtn">地図に戻る</button>
  </section>

  <footer id="foot"></footer>
</div>

<script>
/* ============================================================
   旅の50文 — 海外旅行で使う英語を、口の在庫にする
   段階: 1 言える / 2 聞いて返せる / 3 型で増やせる / 4 場面を通せる(準備中) / 5 前日リハーサル
   判子の条件: 音声認識で「通じた」 かつ 声が出るまで2.5秒以内（迷っていない）
   ============================================================ */

const PHRASES = [
 {s:"機内",j:"飲み物を聞かれた。水がほしい。",e:"Water, please.",m:"水をください。",t:"「ウォーター」より<b>ワラ</b>に近い。母音にはさまれたtはラ行になる。"},
 {s:"機内",j:"食事はチキンかビーフか、と聞かれた。",e:"Chicken, please.",m:"チキンでお願いします。",t:"pleaseは「プリーズ」と伸ばしすぎず<b>プリーz</b>と軽く落とす。"},
 {s:"機内",j:"通路を通りたい。前の人に声をかける。",e:"Excuse me.",m:"すみません。",t:"「エクスキューズミー」ではなく<b>クスキューzミ</b>。頭のEはほぼ聞こえない。"},
 {s:"機内",j:"寒い。毛布がほしい。",e:"Can I have a blanket?",m:"毛布をもらえますか。",t:"Can I は切らずに<b>キャナイ</b>と1語のようにつなげる。"},
 {s:"どこでも",j:"英語で話しかけられた。まず自分の状況を伝える。",e:"Sorry, I don't speak English.",m:"すみません、英語が話せません。",t:"don'tは<b>ドウン</b>。最後のtは飲み込んでよい。これが言えると相手が速度を落とす。"},
 {s:"どこでも",j:"早口で聞き取れなかった。",e:"Could you say that again?",m:"もう一度言ってもらえますか。",t:"say that again を<b>セイザッアゲン</b>と1かたまりで。旅で一番使う1文。"},
 {s:"どこでも",j:"まだ速い。ゆっくり話してほしい。",e:"Slowly, please.",m:"ゆっくりお願いします。",t:"oは「オ」ではなく<b>オウ</b>。「スロウリ」。"},
 {s:"入国審査",j:"旅行の目的を聞かれた。",e:"Sightseeing.",m:"観光です。",t:"<b>サイ</b>トシーイング。最初を強く。文にしなくてよい。"},
 {s:"入国審査",j:"何日滞在するか聞かれた。",e:"Five days.",m:"5日間です。",t:"daysの語尾は濁って<b>デイズ</b>。「デイス」だと伝わりにくい。"},
 {s:"入国審査",j:"どこに泊まるか聞かれた。予約票を見せながら。",e:"This hotel.",m:"このホテルです。",t:"hotelは後ろが強い<b>ホテェル</b>。日本語と強弱が逆。"},
 {s:"税関",j:"申告するものはあるか、と聞かれた。",e:"No, nothing.",m:"いいえ、何もありません。",t:"nothingのoは「オ」ではなく<b>ア</b>。「ナッシン」。"},
 {s:"空港",j:"荷物受取所。自分のスーツケースが出てこない。",e:"My bag is missing.",m:"荷物が出てきません。",t:"missingの前でひと呼吸置くと、深刻さが伝わる。"},
 {s:"カフェ",j:"コーヒーを2つ頼む。",e:"Two coffees, please.",m:"コーヒーを2つください。",t:"coffeeは<b>コーフィ</b>。最初を強く、後ろは軽く。"},
 {s:"カフェ",j:"ショーケースを指さして注文する。",e:"This one, please.",m:"これをください。",t:"This one は<b>ディスワン</b>とつなげる。指さしと一緒に使えば万能。"},
 {s:"カフェ",j:"店内で食べるか持ち帰るか聞かれた。",e:"To go, please.",m:"持ち帰りでお願いします。",t:"店内なら <b>For here, please.</b> 2つ セットで覚える。"},
 {s:"カフェ",j:"注文の途中。もう頼むものはない。",e:"That's all.",m:"以上です。",t:"allは口を大きく開けて<b>オール</b>。これを言うと会計に進んでくれる。"},
 {s:"食事",j:"席についた。メニューがほしい。",e:"Can I have the menu?",m:"メニューをもらえますか。",t:"menuは伸ばさず<b>メニュ</b>。Can I have 〜 は何にでも使える型。"},
 {s:"食事",j:"何を頼めばいいか分からない。",e:"What do you recommend?",m:"おすすめは何ですか。",t:"What do you は潰して<b>ワッデュ</b>。丁寧に言おうとするほど伝わらない。"},
 {s:"食事",j:"玉ねぎが苦手。抜いてほしい。",e:"No onions, please.",m:"玉ねぎ抜きでお願いします。",t:"onionは「オニオン」ではなく<b>アニャン</b>に近い。"},

/* ---------- 定数 ---------- */
const KEY='tabi50.v1';
const DAY=86400000;
const INTERVALS=[1*DAY,3*DAY,7*DAY,14*DAY,30*DAY];
const MAX_TRIES=4;        // これを超えたら今日は見送り（明日また出る）
const HESITATE_MS=2500;   // 声が出るまでこれ以上かかったら「迷い」
const MATCH_MIN=0.6;      // 目標文の単語のうち、この割合が聞き取れたら「通じた」
const MIN_HOLD_MS=300;    // これより短い押下は「押し間違い」扱い
const MAX_HOLD_MS=15000;  // 押しっぱなしの保険
const PER_SESSION=5;

/* ---------- 段階ごとのカード（形をそろえる） ----------
   card = {s:場面, j:状況(日本語), h?:相手の一言, hj?:その意味, e:言う英文, a:[別解], must?:必須語, m:意味, t:コツ} */
const DECKS={
  s1: PHRASES.map(p=>({s:p.s,j:p.j,e:p.e,a:[p.e],m:p.m,t:p.t})),
  s2: EXCHANGES.map(x=>({s:x.s,j:x.j,h:x.h,hj:x.hj,e:x.e,a:[x.e].concat(x.a||[]),m:x.m,t:x.t})),
  s3: PATTERNS.flatMap((p,pi)=>p.x.map(([e,ja,must])=>({s:'型 '+(pi+1)+' · '+p.n,j:p.ja.replace('〜','「'+ja+'」')+'、と伝える。',e:e,a:[e],must:must,m:p.ja.replace('〜',ja),t:p.t})))
};
const STAGES=[
  {id:'s1',order:1,title:'言える',sub:'50文が迷わず口から出る',deck:'s1',goal:40},
  {id:'s2',order:2,title:'聞いて返せる',sub:'相手の一言を聞き取って、正しく返す',deck:'s2',goal:30},
  {id:'s5',order:3,title:'前日リハーサル',sub:'明日行く場面だけを選んで、通しで回す',deck:'s1',rehearsal:true},
  {id:'s3',order:4,title:'型で増やせる',sub:'12の型に言葉を入れ替えて、300文にする',deck:'s3',goal:45},
  {id:'s4',order:5,title:'場面を通せる',sub:'店員役のAIと、注文から会計まで',locked:'準備中'}
];
/* 画像は img/ に置く。無い場合は表示しないだけで動作は変わらない。 */
const IMG_DIR='img/';
const SCENE_IMG={'機内':'kinai','入国審査':'nyukoku','税関':'zeikan','空港':'kuko','カフェ':'cafe','食事':'shokuji','買い物':'kaimono','ホテル':'hotel','移動':'ido','困ったとき':'komatta','旅先で':'tabisaki','どこでも':'dokodemo'};
const STAGE_IMG={s1:'stage-1',s2:'stage-2',s5:'stage-3',s3:'stage-4',s4:'stage-5'};
const imgOk={};   // 一度読めた／読めなかった画像を覚える
function setImg(el,name){
  if(!name){ el.hidden=true; return; }
  const src=IMG_DIR+name+'.png';
  if(imgOk[src]===false){ el.hidden=true; return; }
  el.onload=()=>{ imgOk[src]=true; el.hidden=false; };
  el.onerror=()=>{ imgOk[src]=false; el.hidden=true; };
  el.hidden=(imgOk[src]!==true);
  if(el.getAttribute('src')!==src) el.src=src;
}
function sceneImgName(sceneLabel){ for(const k of Object.keys(SCENE_IMG)){ if(sceneLabel===k) return SCENE_IMG[k]; } return null; }
const SCENE_GROUPS=[
  {name:'空港・機内',scenes:['機内','入国審査','税関','空港']},
  {name:'カフェ・食事',scenes:['カフェ','食事']},
  {name:'買い物',scenes:['買い物']},
  {name:'ホテル',scenes:['ホテル']},
  {name:'移動',scenes:['移動']},
  {name:'困ったとき・雑談',scenes:['困ったとき','どこでも','旅先で']}
];

/* ---------- 保存 ---------- */
let state=null;
let session=null;
let tries=0, tryMarks=[];
let attemptToken=0;
let rec=null;
let micState='unknown';   // unknown | ok | blocked
let holding=false, holdAt=0;

function blankStore(n){ const c={}; for(let i=0;i<n;i++) c[i]={learned:false,box:0,due:0,seen:false}; return c; }
function blankState(){ return {cards:blankStore(DECKS.s1.length), s2:blankStore(DECKS.s2.length), s3:blankStore(DECKS.s3.length), updatedAt:0}; }
function normStore(raw,n){
  const b=blankStore(n);
  if(!raw||typeof raw!=='object') return b;
  for(let i=0;i<n;i++){ const s=raw[i]; if(s&&typeof s==='object') b[i]={learned:!!s.learned,box:Math.max(0,Math.min(5,Number(s.box)||0)),due:Number(s.due)||0,seen:!!s.seen}; }
  return b;
}
function normalizeState(raw){
  const base=blankState();
  if(!raw||typeof raw!=='object') return base;
  base.cards=normStore(raw.cards,DECKS.s1.length);
  base.s2=normStore(raw.s2,DECKS.s2.length);
  base.s3=normStore(raw.s3,DECKS.s3.length);
  base.updatedAt=Number(raw.updatedAt)||0;
  return base;
}
function storeOf(deck){ return deck==='s1'?state.cards:state[deck]; }
function loadLocal(){ try{ return normalizeState(JSON.parse(localStorage.getItem(KEY))); }catch(e){ return blankState(); } }
function save(){ state.updatedAt=Date.now(); try{ localStorage.setItem(KEY,JSON.stringify(state)); }catch(e){} }

/* ---------- 引き継ぎ ---------- */
function rowsOf(store,n){ const now=Date.now(),r=[]; for(let i=0;i<n;i++){ const c=store[i]; r.push([c.learned?1:0,c.seen?1:0,c.box,Math.max(0,Math.round((c.due-now)/DAY))]); } return r; }
function storeFromRows(rows,n){ const now=Date.now(),b=blankStore(n); (rows||[]).slice(0,n).forEach((r,i)=>{ b[i]={learned:!!r[0],seen:!!r[1],box:Math.max(0,Math.min(5,Number(r[2])||0)),due:now+(Number(r[3])||0)*DAY}; }); return b; }
function exportCode(){
  const json=JSON.stringify({v:2,s1:rowsOf(state.cards,DECKS.s1.length),s2:rowsOf(state.s2,DECKS.s2.length),s3:rowsOf(state.s3,DECKS.s3.length)});
  return 'T50-'+btoa(unescape(encodeURIComponent(json))).replace(/=+$/,'');
}
function importCode(code){
  const m=String(code).trim().match(/^T50-([A-Za-z0-9+/]+)$/);
  if(!m) throw new Error('コードの形が違います。「T50-」から始まる文字列を貼ってください。');
  const obj=JSON.parse(decodeURIComponent(escape(atob(m[1]))));
  const fresh=blankState();
  if(obj&&obj.v===1&&Array.isArray(obj.rows)) fresh.cards=storeFromRows(obj.rows,DECKS.s1.length);
  else if(obj&&obj.v===2){ fresh.cards=storeFromRows(obj.s1,DECKS.s1.length); fresh.s2=storeFromRows(obj.s2,DECKS.s2.length); fresh.s3=storeFromRows(obj.s3,DECKS.s3.length); }
  else throw new Error('このコードは読めませんでした。');
  state=fresh; save();
}

/* ---------- 音声出力 ---------- */
let voice=null;
function pickVoice(){
  if(!('speechSynthesis' in window)) return null;
  const vs=speechSynthesis.getVoices(); if(!vs.length) return null;
  const en=vs.filter(v=>/^en[-_]/i.test(v.lang)); if(!en.length) return null;
  return en.find(v=>/samantha|google us english|aria|jenny/i.test(v.name)) || en.find(v=>/^en[-_]US/i.test(v.lang)) || en[0];
}
if('speechSynthesis' in window){ speechSynthesis.addEventListener('voiceschanged',()=>{voice=pickVoice();}); voice=pickVoice(); }
function speak(text,rate){
  if(!('speechSynthesis' in window)) return false;
  try{ speechSynthesis.cancel(); if(!voice) voice=pickVoice();
    const u=new SpeechSynthesisUtterance(text); u.lang='en-US'; u.rate=rate; u.pitch=1; if(voice) u.voice=voice;
    speechSynthesis.speak(u); return true; }catch(e){ return false; }
}
function stopAudio(){ if('speechSynthesis' in window){ try{ speechSynthesis.cancel(); }catch(e){} } }

/* ---------- 判定（通じたか） ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function normalizeWords(s){ return s.toLowerCase().replace(/[^a-z0-9\s']/g,' ').replace(/\s+/g,' ').trim().split(' ').filter(Boolean); }
function lev(a,b){
  const m=a.length,n=b.length; if(Math.abs(m-n)>2) return 3;
  let prev=Array.from({length:n+1},(_,i)=>i),cur=new Array(n+1);
  for(let i=1;i<=m;i++){ cur[0]=i; for(let j=1;j<=n;j++){ cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1)); } [prev,cur]=[cur,prev]; }
  return prev[n];
}
function matchScore(said,target){
  const pool=normalizeWords(said), want=normalizeWords(target); if(!want.length) return 0;
  let hit=0;
  for(const w of want){ let idx=pool.indexOf(w); if(idx<0&&w.length>3) idx=pool.findIndex(x=>Math.abs(x.length-w.length)<=2&&lev(x,w)<=1); if(idx>=0){ pool.splice(idx,1); hit++; } }
  return hit/want.length;
}
function hasWord(said,word){ const w=normalizeWords(word)[0]; if(!w) return true; return normalizeWords(said).some(x=>x===w||(w.length>3&&Math.abs(x.length-w.length)<=2&&lev(x,w)<=1)); }
// 別解のうち一番近いものの点数。必須語が無ければ 0 扱い。
function judgeText(said,card){
  let best=0; for(const t of card.a){ best=Math.max(best,matchScore(said,t)); }
  if(card.must&&!hasWord(said,card.must)) return {score:best,missing:card.must};
  return {score:best,missing:null};
}
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ---------- 出題順（Leitner） ---------- */
function dueQueue(store,n){
  const now=Date.now(); const ids=[...Array(n).keys()];
  const reviews=ids.filter(i=>store[i].seen&&store[i].due<=now).sort((a,b)=>store[a].due-store[b].due);
  const fresh=ids.filter(i=>!store[i].seen);
  const q=reviews.slice(0,3);
  for(const i of fresh){ if(q.length>=PER_SESSION) break; q.push(i); }
  for(const i of reviews.slice(3)){ if(q.length>=PER_SESSION) break; q.push(i); }
  return q;
}
function learnedCount(store){ return Object.values(store).filter(c=>c.learned).length; }
function markPassed(store,i){ const c=store[i]; c.seen=true; c.learned=true; c.box=Math.min(c.box+1,5); c.due=Date.now()+INTERVALS[c.box-1]; save(); }
function markSkipped(store,i){ const c=store[i]; c.seen=true; c.due=Date.now()+DAY; save(); }
function recommendedStage(){
  for(const st of STAGES){ if(st.locked||st.rehearsal) continue; if(learnedCount(storeOf(st.deck))<st.goal) return st.id; }
  return 's5';
}

/* ---------- DOM ---------- */
const $=id=>document.getElementById(id);
function show(which){ for(const [k,el] of Object.entries({home:$('scHome'),pick:$('scPick'),card:$('scCard'),done:$('scDone')})) el.hidden=(k!==which); }
function abortAttempt(){ attemptToken++; holding=false; if(rec){ try{ rec.abort(); }catch(e){} rec=null; } stopAudio(); }

function render(){
  const total=DECKS.s1.length+DECKS.s2.length+DECKS.s3.length;
  const n=learnedCount(state.cards)+learnedCount(state.s2)+learnedCount(state.s3);
  $('stockN').textContent=n; $('stockT').textContent=total;
  $('meterFill').style.width=(n/total*100)+'%';

  // 学びの地図
  const rec_=recommendedStage();
  const map=$('map'); map.textContent='';
  for(const st of STAGES){
    const b=document.createElement('button'); b.className='stage'; b.dataset.stage=st.id;
    let cnt='',bar='';
    if(!st.locked){
      const store=storeOf(st.deck), tot=DECKS[st.deck].length, l=learnedCount(store);
      if(!st.rehearsal){ cnt=l+' / '+tot; bar='<div class="bar"><i style="width:'+(l/tot*100)+'%"></i></div>'; }
    }
    const badge = st.locked ? '<span class="badge soft">'+st.locked+'</span>'
                : (st.id===rec_ ? '<span class="badge">次はここ</span>' : (st.rehearsal?'<span class="badge soft">旅の前日に</span>':''));
    b.innerHTML='<span class="iconwrap noimg"><img class="icon" alt="" hidden><span class="num">'+st.order+'</span></span><span class="body"><span class="ttl">'+st.title+badge+'</span><span class="sub">'+st.sub+'</span>'+bar+'</span><span class="cnt">'+cnt+'</span>';
    const ic=b.querySelector('img.icon'), wrap=b.querySelector('.iconwrap');
    ic.onload=()=>{ ic.hidden=false; wrap.classList.remove('noimg'); imgOk[ic.src]=true; };
    ic.onerror=()=>{ ic.hidden=true; wrap.classList.add('noimg'); imgOk[ic.src]=false; };
    ic.src=IMG_DIR+STAGE_IMG[st.id]+'.png';
    if(st.locked) b.disabled=true;
    map.appendChild(b);
  }

  setImg($('hero'),'hero');

  // 査証欄（段階1）
  const visa=$('visa'); visa.textContent='';
  for(let i=0;i<DECKS.s1.length;i++){
    const d=document.createElement('div'); const done=state.cards[i].learned;
    d.className='slot '+(done?'done':'empty'); d.textContent=i+1;
    if(done) d.style.transform='rotate('+(((i*37)%11)-5)+'deg)';
    d.title=done?DECKS.s1[i].e:'まだ'; visa.appendChild(d);
  }
  const l1=learnedCount(state.cards);
  $('visaHint').textContent = l1===0 ? 'まだ空です' : l1+'つ 押した';

  $('foot').textContent = micState==='blocked'
    ? 'この画面ではマイクが使えないため、判定ができません。'
    : '判子の条件は2つ。通じたこと。そして、声が出るまで2.5秒以内だったこと。';
}

/* ---------- マイクが使えないとき ---------- */
function blockMic(msg){
  micState='blocked'; holding=false;
  $('sayBtn').hidden=true; $('sayBtn').classList.remove('hold');
  $('verdict').textContent='';
  $('blocker').innerHTML='<b>マイクが使えません。</b><br>'+esc(msg)+'<br>iPhone は Safari か Chrome、Android は Chrome で、このページを直接開いてください。';
  $('blocker').hidden=false;
  render();
}

/* ---------- セッション ---------- */
function startSession(stageId,ids){
  const st=STAGES.find(s=>s.id===stageId);
  session={stage:st,deck:st.deck,queue:ids,idx:0,gained:0,passed:0,lats:[]};
  openCard();
}
function startStage(stageId){
  const st=STAGES.find(s=>s.id===stageId);
  if(!st||st.locked) return;
  if(st.rehearsal){ openPicker(); return; }
  const store=storeOf(st.deck); const q=dueQueue(store,DECKS[st.deck].length);
  if(!q.length){ $('foot').textContent='この段階の今日の分は終わりました。明日また、覚えた文が混ざって出ます。'; return; }
  startSession(stageId,q);
}
function openPicker(){
  const box=$('picker'); box.textContent='';
  SCENE_GROUPS.forEach((g,gi)=>{
    const n=DECKS.s1.filter(c=>g.scenes.includes(c.s)).length;
    const l=document.createElement('label');
    l.innerHTML='<input type="checkbox" value="'+gi+'"><img class="pick-img" alt="" hidden><span>'+g.name+'</span><small>'+n+' 文</small>';
    setImg(l.querySelector('img'), SCENE_IMG[g.scenes[0]]);
    box.appendChild(l);
  });
  $('pickStart').disabled=true;
  show('pick');
}
function curCard(){ return DECKS[session.deck][session.queue[session.idx]]; }
function curStore(){ return storeOf(session.deck); }
function curId(){ return session.queue[session.idx]; }

function paintTries(marks){ const d=$('tries'); d.textContent=''; for(let k=0;k<MAX_TRIES;k++){ const i=document.createElement('i'); if(marks[k]) i.className=marks[k]; d.appendChild(i); } }

function openCard(){
  abortAttempt(); tries=0; tryMarks=[];
  const c=curCard();
  $('dots').textContent='';
  for(let k=0;k<session.queue.length;k++){ const s=document.createElement('span'); if(k<=session.idx) s.className='on'; $('dots').appendChild(s); }
  $('scene').textContent=(session.stage.rehearsal?'リハーサル · ':'')+c.s;
  setImg($('sceneImg'), sceneImgName(c.s) || (session.deck==='s3' ? 'kata' : null));
  $('situation').textContent=c.j;
  $('stageNote').textContent = c.h ? '相手の一言を聞いて、返します。文字は出しません。' : 'まず耳で覚えます。英文はまだ出しません。';
  $('playBtn').textContent = c.h ? '相手の言葉を聞く' : '聞く';
  $('stageListen').hidden=false; $('answer').hidden=true;
  $('slowBtn').disabled=true; $('sayBtn').disabled=true;
  $('sayBtn').hidden=(micState==='blocked'); $('sayBtn').textContent='押しながら 話す'; $('sayBtn').classList.remove('hold');
  $('verdict').textContent=''; $('peek').hidden=true; $('peek').textContent='';
  $('revealBtn').hidden=false; $('revealBtn').textContent = c.h ? '相手の言葉と答えを見る' : '英文を見る';
  $('blocker').hidden=(micState!=='blocked');
  paintTries(tryMarks);
  if(!SR&&micState!=='blocked') blockMic('このブラウザは音声認識に対応していません。');
  show('card');
}
function sealEl(i){ const d=document.createElement('div'); d.className='seal-mark land'; d.innerHTML='通じた<br>'+(i+1); return d; }
function revealText(){
  const c=curCard();
  $('peek').innerHTML = c.h ? '<span class="hear-ja">相手: '+esc(c.h)+'（'+esc(c.hj)+'）</span><br>'+esc(c.e) : esc(c.e);
  $('peek').hidden=false; $('revealBtn').hidden=true;
}
function playCue(rate){ const c=curCard(); return speak(c.h||c.e,rate); }

function listen(){
  const c=curCard(); const my=++attemptToken; stopAudio();
  let r; try{ r=new SR(); }catch(e){ blockMic('音声認識を起動できませんでした。'); return; }
  rec=r; r.lang='en-US'; r.continuous=true; r.interimResults=true; r.maxAlternatives=5;
  const v=$('verdict');
  v.innerHTML='<span class="listening"></span><p>聞いています。言い終わったら指を離してください。</p>';
  $('sayBtn').textContent='離すと判定'; $('sayBtn').classList.add('hold');
  let t0=performance.now(), tSpeech=null, best=0, bestText='', settled=false;
  r.onspeechstart=()=>{ if(my===attemptToken&&tSpeech===null) tSpeech=performance.now(); };
  r.onresult=ev=>{
    if(my!==attemptToken) return;
    if(tSpeech===null) tSpeech=performance.now();
    for(let i=ev.resultIndex;i<ev.results.length;i++){ const res=ev.results[i]; if(!res.isFinal) continue;
      for(let k=0;k<res.length;k++){ const alt=res[k].transcript||''; const sc=judgeText(alt,c).score; if(!bestText||sc>best){ best=sc; bestText=alt; } } }
  };
  const resetBtn=()=>{ $('sayBtn').classList.remove('hold'); $('sayBtn').textContent='もう一度 押しながら 話す'; };
  r.onerror=ev=>{
    if(my!==attemptToken) return; settled=true; clearTimeout(watchdog); try{ r.abort(); }catch(e){}
    const code=ev.error; resetBtn();
    if(code==='not-allowed'||code==='service-not-allowed'){ blockMic('マイクの使用が許可されていません。ブラウザの設定でこのページのマイクを「許可」にしてください。'); return; }
    if(code==='audio-capture'){ blockMic('マイクが見つかりませんでした。'); return; }
    if(code==='no-speech'){ v.innerHTML='<p>声が聞こえませんでした。押したまま話して、言い終わってから離してください。</p>'; return; }
    if(code==='network'){ v.innerHTML='<p>認識サービスに届きませんでした。電波を確認して、もう一度。</p>'; return; }
    if(code==='aborted'){ return; }
    v.innerHTML='<p>うまく聞き取れませんでした。もう一度どうぞ。</p>';
  };
  r.onend=()=>{ if(my!==attemptToken||settled) return; settled=true; clearTimeout(watchdog); try{ r.abort(); }catch(e){} rec=null; judge(); };
  const watchdog=setTimeout(()=>{ if(my===attemptToken&&!settled){ try{ r.stop(); }catch(e){} } },MAX_HOLD_MS);

  function judge(){
    resetBtn();
    if(!bestText){ v.innerHTML='<p>声が聞こえませんでした。ボタンを押したまま話して、言い終わってから離してください。</p>'; return; }
    tries++;
    const jr=judgeText(bestText,c);
    const lat = tSpeech!==null ? (tSpeech-t0) : null; const latS = lat!==null ? (lat/1000).toFixed(1) : null;
    if(jr.score>=MATCH_MIN && !jr.missing && (lat===null||lat<=HESITATE_MS)){
      tryMarks.push('hit'); paintTries(tryMarks);
      v.textContent=''; v.appendChild(sealEl(curId()));
      const t=document.createElement('p'); t.innerHTML='<b>通じました。</b>'+(latS!==null?' 反応 '+latS+' 秒。':''); v.appendChild(t);
      setTimeout(()=>pass(lat),700); return;
    }
    tryMarks.push('miss'); paintTries(tryMarks);
    if(jr.missing) v.innerHTML='<p>いまのは <span class="heard">「'+esc(bestText)+'」</span> に聞こえました。<br>肝心の <b>'+esc(jr.missing)+'</b> が入っていません。</p>';
    else if(jr.score>=MATCH_MIN) v.innerHTML='<p><b>通じました。</b>ただ、声が出るまで '+latS+' 秒。<br>もう一度、今度は考えずにすぐ。</p>';
    else v.innerHTML='<p>いまのは <span class="heard">「'+esc(bestText)+'」</span> に聞こえました。<br>もう一度、聞いてから言ってみましょう。</p>';
    if(tries>=MAX_TRIES){ giveUp(); return; }
    if(tries>=2) revealText();
  }
  try{ r.start(); }catch(e){ v.innerHTML='<p>もう一度どうぞ。</p>'; resetBtn(); }
}
function holdStart(ev){
  if(ev&&ev.preventDefault) ev.preventDefault();
  if(holding||$('sayBtn').disabled||$('sayBtn').hidden) return;
  holding=true; holdAt=performance.now();
  try{ if(ev&&ev.pointerId!==undefined) $('sayBtn').setPointerCapture(ev.pointerId); }catch(e){}
  listen();
}
function holdEnd(){
  if(!holding) return; holding=false;
  const held=performance.now()-holdAt;
  if(rec){
    if(held<MIN_HOLD_MS){ abortAttempt(); $('sayBtn').classList.remove('hold'); $('sayBtn').textContent='押しながら 話す'; $('verdict').innerHTML='<p>押している間だけ聞いています。押したまま話して、言い終わってから離してください。</p>'; return; }
    try{ rec.stop(); }catch(e){}
  }
}

function pass(lat){
  const i=curId(), store=curStore(); const wasNew=!store[i].learned;
  markPassed(store,i); if(wasNew) session.gained++; session.passed++; if(lat!==null) session.lats.push(lat);
  render(); revealAnswer(true,lat);
}
function giveUp(){ markSkipped(curStore(),curId()); render(); revealAnswer(false,null); }
function revealAnswer(passed,lat){
  const c=curCard(), i=curId();
  $('stageListen').hidden=true;
  $('hearBox').hidden=!c.h; if(c.h){ $('hearText').textContent=c.h; $('hearJa').textContent=c.hj; }
  $('enText').textContent=c.e; $('meanText').textContent=c.m; $('tipText').innerHTML=c.t;
  const v=$('answerVerdict'); v.textContent='';
  if(passed){ v.appendChild(sealEl(i)); const t=document.createElement('p'); t.innerHTML='<b>在庫に入りました。</b>'; v.appendChild(t);
    $('stat').textContent=(lat!==null?'反応 '+(lat/1000).toFixed(1)+' 秒 · ':'')+tries+' 回目で通じた'; }
  else { const t=document.createElement('p'); t.textContent='今日はここまで。この文は明日また出します。'; v.appendChild(t); $('stat').textContent=tries+' 回 試した'; }
  $('replayBtn').textContent = c.h ? '答えの音を聞く' : 'もう一度聞く';
  $('answer').hidden=false;
  $('nextBtn').textContent = session.idx>=session.queue.length-1 ? '終わる' : '次へ';
}
function finishSession(){
  const st=session.stage; const avg=session.lats.length?(session.lats.reduce((a,b)=>a+b,0)/session.lats.length/1000).toFixed(1):null;
  if(st.rehearsal){ $('doneLabel').textContent='通じた文'; $('gained').textContent=session.passed+' / '+session.queue.length;
    $('doneMsg').textContent = session.passed===session.queue.length ? '全部通じました。明日はこのまま行けます。' : '通じなかった文は、明日また出ます。もう一度回してもいい。'; }
  else { $('doneLabel').textContent='今日ふえた判子'; $('gained').textContent=session.gained;
    const l=learnedCount(storeOf(st.deck)), tot=DECKS[st.deck].length;
    $('doneMsg').textContent = l>=tot ? 'この段階はすべて在庫に入りました。地図の次へ。' : '「'+st.title+'」はいま '+l+' / '+tot+'。明日もまた5枚。'; }
  $('doneStat').textContent = avg!==null ? '今日の平均反応 '+avg+' 秒' : '';
  show('done');
}

/* ---------- イベント ---------- */
$('map').addEventListener('click',e=>{ const b=e.target.closest('.stage'); if(b&&!b.disabled) startStage(b.dataset.stage); });
$('picker').addEventListener('change',()=>{ $('pickStart').disabled=!$('picker').querySelector('input:checked'); });
$('pickStart').addEventListener('click',()=>{
  const gs=[...$('picker').querySelectorAll('input:checked')].map(i=>SCENE_GROUPS[Number(i.value)]);
  const scenes=gs.flatMap(g=>g.scenes);
  const ids=DECKS.s1.map((c,i)=>scenes.includes(c.s)?i:-1).filter(i=>i>=0);
  if(!ids.length) return;
  startSession('s5',ids);
});
$('pickBack').addEventListener('click',()=>{ render(); show('home'); });
$('playBtn').addEventListener('click',()=>{
  const ok=playCue(0.85); $('slowBtn').disabled=false;
  if(micState!=='blocked') $('sayBtn').disabled=false;
  if(!ok){ $('stageNote').textContent='このブラウザでは音が出せません。文字を見ながら声に出してください。'; revealText(); }
  else { $('stageNote').textContent = curCard().h ? '聞き取れたら、赤いボタンを押しながら返事をして、離す。' : '赤いボタンを押している間だけマイクがオンになります。押しながら言って、離す。'; }
});
$('slowBtn').addEventListener('click',()=>playCue(0.6));
$('replayBtn').addEventListener('click',()=>speak(curCard().e,0.85));
const sayBtn=$('sayBtn');
sayBtn.addEventListener('pointerdown',holdStart); sayBtn.addEventListener('pointerup',holdEnd);
sayBtn.addEventListener('pointercancel',holdEnd); sayBtn.addEventListener('lostpointercapture',holdEnd);
sayBtn.addEventListener('contextmenu',e=>e.preventDefault());
sayBtn.addEventListener('keydown',e=>{ if((e.key===' '||e.key==='Enter')&&!e.repeat) holdStart(e); });
sayBtn.addEventListener('keyup',e=>{ if(e.key===' '||e.key==='Enter') holdEnd(e); });
$('revealBtn').addEventListener('click',revealText);
$('nextBtn').addEventListener('click',()=>{ abortAttempt(); session.idx++; if(session.idx>=session.queue.length) finishSession(); else openCard(); });
$('quitBtn').addEventListener('click',()=>{ abortAttempt(); render(); show('home'); });
$('backBtn').addEventListener('click',()=>{ render(); show('home'); });
$('xferBtn').addEventListener('click',()=>{ const box=$('xfer'); box.hidden=!box.hidden; if(!box.hidden){ $('xferOut').value=exportCode(); $('xferMsg').textContent=''; } });
$('xferOut').addEventListener('focus',e=>e.target.select());
$('xferCopy').addEventListener('click',async()=>{ const t=$('xferOut').value; try{ await navigator.clipboard.writeText(t); $('xferMsg').textContent='コピーしました。もう一方の端末（開き方）で貼ってください。'; }catch(e){ $('xferOut').focus(); $('xferOut').select(); $('xferMsg').textContent='長押しでコピーしてください。'; } });
$('xferIn_btn').addEventListener('click',()=>{ try{ importCode($('xferIn').value); render(); $('xferMsg').textContent='復元しました。判子 '+$('stockN').textContent+'。'; $('xferIn').value=''; }catch(e){ $('xferMsg').textContent=e.message; } });
document.addEventListener('visibilitychange',()=>{ if(document.hidden) abortAttempt(); });
window.addEventListener('pagehide',()=>abortAttempt());

/* ---------- 起動 ---------- */
state=loadLocal();
render();
show('home');
</script>
